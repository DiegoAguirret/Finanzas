<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recupera tu contraseña</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f8f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f8f5;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border:1px solid #dde9e3;border-radius:16px;">
        <tr>
          <td style="padding:32px 32px 0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;color:#064e3b;">
            Mis Finanzas
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:700;color:#1f2333;">
            ¿Olvidaste tu contraseña?
          </td>
        </tr>
        <tr>
          <td style="padding:10px 32px 0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#3f4a45;">
            No te preocupes, pasa a cualquiera. Pulsa el botón para crear una nueva.
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#047857" style="border-radius:10px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">Crear nueva contraseña</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 32px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;color:#5f7169;">
            ¿No lo pediste? Ignora este correo: tu contraseña sigue igual.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
